<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>光與鹽｜09-2026</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#d9d2c7;
    font-family:"Noto Sans TC",sans-serif;
    overflow:hidden;
}

.viewer{
    width:100vw;
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:18px;
}

.book{
    width:min(96vw,1400px);
    height:min(88vh,990px);
    display:flex;
    justify-content:center;
    align-items:center;
}

.spread{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:0;
    filter:drop-shadow(0 18px 35px rgba(0,0,0,.30));
}

.page{
    width:min(42vw,495px);
    aspect-ratio:210/297;
    background:white;
    overflow:hidden;
}

.page img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

/* 封面單頁 */
.single .page{
    width:min(70vw,495px);
}

.controls{
    display:flex;
    align-items:center;
    gap:18px;
}

button{
    width:64px;
    height:64px;
    border:none;
    border-radius:50%;
    background:#8a4b23;
    color:white;
    font-size:30px;
    cursor:pointer;
    transition:.2s;
}

button:hover{
    background:#a65b2d;
}

button:disabled{
    opacity:.45;
    cursor:not-allowed;
}

.counter{
    background:white;
    padding:14px 30px;
    border-radius:24px;
    min-width:160px;
    text-align:center;
    font-size:28px;
}

/* ---------- 手機 ---------- */

@media (max-width:768px){

body{
    overflow:hidden;
}

.viewer{
    gap:14px;
}

.book{
    width:100vw;
    height:calc(100vh - 110px);
}

.spread{
    flex-direction:column;
}

.page{
    width:96vw;
    max-width:none;
    aspect-ratio:210/297;
}

/* 手機完整顯示，不裁切 */
.page img{
    object-fit:contain;
}

.spread .page:nth-child(2){
    display:none;
}

.single .page{
    width:96vw;
}

button{
    width:54px;
    height:54px;
    font-size:24px;
}

.counter{
    min-width:120px;
    font-size:18px;
    padding:12px 24px;
}

}
</style>
</head>

<body>

<div class="viewer">

<div class="book">
    <div id="spread" class="spread"></div>
</div>

<div class="controls">
    <button id="prev">←</button>
    <div id="counter" class="counter"></div>
    <button id="next">→</button>
</div>

</div>

<script>

const TOTAL=20;
const spreads=[];

/* 封面 */
spreads.push([1]);

/* 2-3、4-5... */
for(let i=2;i<=TOTAL;i+=2){
    if(i+1<=TOTAL){
        spreads.push([i,i+1]);
    }else{
        spreads.push([i]);
    }
}

let current=0;

const spread=document.getElementById("spread");
const counter=document.getElementById("counter");

function render(){

    const mobile=window.innerWidth<=768;
    const pages=spreads[current];

    spread.className=pages.length===1?"spread single":"spread";
    spread.innerHTML="";

    const showPages=mobile?[pages[0]]:pages;

    showPages.forEach(p=>{

        const div=document.createElement("div");
        div.className="page";

        const img=document.createElement("img");
        img.src=p+".png";
        img.alt="Page "+p;
        img.loading="eager";

        div.appendChild(img);
        spread.appendChild(div);

    });

    counter.textContent=pages[0]+" / "+TOTAL;

    document.getElementById("prev").disabled=current===0;
    document.getElementById("next").disabled=current===spreads.length-1;
}

function next(){
    if(current<spreads.length-1){
        current++;
        render();
    }
}

function prev(){
    if(current>0){
        current--;
        render();
    }
}

document.getElementById("next").onclick=next;
document.getElementById("prev").onclick=prev;

/* 鍵盤 */

window.addEventListener("keydown",e=>{
    if(e.key==="ArrowRight")next();
    if(e.key==="ArrowLeft")prev();
});

/* 手機滑動 */

let startX=0;

document.querySelector(".book").addEventListener("touchstart",e=>{
    startX=e.touches[0].clientX;
});

document.querySelector(".book").addEventListener("touchend",e=>{
    const dx=e.changedTouches[0].clientX-startX;

    if(dx<-60)next();
    if(dx>60)prev();
});

window.addEventListener("resize",render);

render();

</script>

</body>
</html>
