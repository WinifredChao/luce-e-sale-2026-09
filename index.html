<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>光與鹽｜09-2026</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
    background:#d9d2c7;
    font-family:"Noto Sans TC",sans-serif;
    overflow:hidden;
}

.viewer{
    width:100vw;
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:18px;
}

.book{
    width:min(96vw,1400px);
    height:min(88vh,990px);
    display:flex;
    justify-content:center;
    align-items:center;
}

.spread{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:0;
    filter:drop-shadow(0 18px 30px rgba(0,0,0,.28));
}

.page{
    width:42vw;
    max-width:495px;
    aspect-ratio:210/297;
    background:white;
    overflow:hidden;
}

.page img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.single .page{
    width:min(70vw,495px);
}

.controls{
    display:flex;
    align-items:center;
    gap:18px;
}

button{
    width:64px;
    height:64px;
    border:none;
    border-radius:50%;
    background:#8a4b23;
    color:white;
    font-size:30px;
    cursor:pointer;
}

button:hover{
    background:#a65b2d;
}

.counter{
    background:white;
    padding:14px 30px;
    border-radius:24px;
    font-size:28px;
    min-width:160px;
    text-align:center;
}

@media (max-width:768px){

.book{
    width:100vw;
    height:auto;
}

.page{
    width:96vw;
    max-width:none;
}

.spread{
    flex-direction:column;
}

.spread .page:nth-child(2){
    display:none;
}

.single .page{
    width:96vw;
}

button{
    width:54px;
    height:54px;
    font-size:24px;
}

.counter{
    font-size:18px;
    min-width:120px;
}
}
</style>
</head>

<body>

<div class="viewer">

<div class="book">
    <div id="spread" class="spread"></div>
</div>

<div class="controls">
    <button id="prev">←</button>
    <div id="counter" class="counter"></div>
    <button id="next">→</button>
</div>

</div>

<script>

const totalPages=20;
const spreads=[];

// 封面
spreads.push([1]);

// 雙頁
for(let i=2;i<=totalPages;i+=2){
    if(i+1<=totalPages)
        spreads.push([i,i+1]);
    else
        spreads.push([i]);
}

let index=0;

const spread=document.getElementById("spread");
const counter=document.getElementById("counter");

function render(){

    const mobile=window.innerWidth<=768;
    const pages=spreads[index];

    spread.className=pages.length===1?"spread single":"spread";
    spread.innerHTML="";

    const show=mobile?[pages[0]]:pages;

    show.forEach(p=>{

        const div=document.createElement("div");
        div.className="page";

        const img=document.createElement("img");
        img.src=`${p}.png`;
        img.loading="eager";

        div.appendChild(img);
        spread.appendChild(div);

    });

    counter.textContent=`${pages[0]} / ${totalPages}`;

    document.getElementById("prev").disabled=index===0;
    document.getElementById("next").disabled=index===spreads.length-1;
}

document.getElementById("prev").onclick=()=>{
    if(index>0){
        index--;
        render();
    }
};

document.getElementById("next").onclick=()=>{
    if(index<spreads.length-1){
        index++;
        render();
    }
};

// 鍵盤
window.addEventListener("keydown",e=>{
    if(e.key==="ArrowLeft")document.getElementById("prev").click();
    if(e.key==="ArrowRight")document.getElementById("next").click();
});

// 手機滑動
let startX=0;

document.querySelector(".book").addEventListener("touchstart",e=>{
    startX=e.touches[0].clientX;
});

document.querySelector(".book").addEventListener("touchend",e=>{
    const dx=e.changedTouches[0].clientX-startX;

    if(dx<-60)document.getElementById("next").click();
    if(dx>60)document.getElementById("prev").click();
});

window.addEventListener("resize",render);

render();

</script>

</body>
</html>
