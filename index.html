
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>光與鹽｜09·2026</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;width:100%}

body{
  background:#d8d0c5;
  overflow:hidden;
  font-family:"Noto Sans TC",sans-serif;
}

.viewer{
  height:100dvh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:16px;
  padding:10px;
}

.book{
  position:relative;
  width:min(96vw,1200px);
  height:min(84dvh,900px);
  perspective:2600px;
}

.sheet{
  position:absolute;
  inset:0;
  transform-origin:left center;
  transform-style:preserve-3d;
  transition:transform .95s cubic-bezier(.22,.61,.36,1);
}

.face{
  position:absolute;
  inset:0;
  display:flex;
  backface-visibility:hidden;
}

.back{
  transform:rotateY(180deg);
}

.page{
  width:50%;
  height:100%;
  background:white;
  overflow:hidden;
  position:relative;
}

.page img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
}

.face::after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:linear-gradient(90deg,rgba(0,0,0,.18),transparent 18%,transparent 82%,rgba(0,0,0,.08));
}

.sheet.flipped{
  transform:rotateY(-180deg);
}

.controls{
  display:flex;
  align-items:center;
  gap:18px;
}

button{
  width:62px;
  height:62px;
  border:none;
  border-radius:50%;
  background:#8a4a21;
  color:white;
  font-size:28px;
  cursor:pointer;
}

.counter{
  background:#f4f1ee;
  border-radius:26px;
  padding:12px 24px;
  min-width:130px;
  text-align:center;
  font-size:22px;
}

@media(max-width:900px){

  body{overflow:hidden;}

  .viewer{
    height:100svh;
    padding:
      calc(env(safe-area-inset-top)+8px)
      8px
      calc(env(safe-area-inset-bottom)+8px);
  }

  .book{
    width:min(94vw,620px);
    height:min(82svh,820px);
  }

  .face{
    display:block;
  }

  .page{
    width:100%;
  }

  .face .page:first-child{
    display:none;
  }

  .sheet{
    transform-origin:center center;
  }

  .sheet.flipped{
    transform:translateX(-8px) rotateY(-180deg);
  }

}
</style>
</head>

<body>

<div class="viewer">

  <div id="book" class="book"></div>

  <div class="controls">
    <button id="prev">←</button>
    <div id="counter" class="counter"></div>
    <button id="next">→</button>
  </div>

</div>

<script>
const pages=[...Array(20)].map((_,i)=>`${i+1}.png`);
const book=document.getElementById("book");
const counter=document.getElementById("counter");

let mobile=()=>window.innerWidth<=900;
let index=0;
let sheets=[];

function flipSound(){

  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();

    const o=ctx.createOscillator();
    const g=ctx.createGain();

    o.type="triangle";
    o.frequency.value=850;

    o.connect(g);
    g.connect(ctx.destination);

    g.gain.value=.018;

    o.start();

    g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.08);

    o.stop(ctx.currentTime+.08);
  }catch(e){}
}

function makePage(src){
  return `<div class="page"><img src="${src}" loading="eager"></div>`;
}

function build(){

  book.innerHTML="";
  sheets=[];

  if(mobile()){

    for(let i=0;i<pages.length;i++){

      const sheet=document.createElement("div");
      sheet.className="sheet";

      sheet.innerHTML=`
        <div class="face">
          ${makePage("")}
          ${makePage(pages[i])}
        </div>`;

      book.appendChild(sheet);
      sheets.push(sheet);
    }

  }else{

    for(let i=0;i<pages.length;i+=2){

      const sheet=document.createElement("div");
      sheet.className="sheet";

      sheet.innerHTML=`
        <div class="face">
          ${makePage(pages[i])}
          ${pages[i+1]?makePage(pages[i+1]):'<div class="page"></div>'}
        </div>

        <div class="face back">
          ${pages[i+2]?makePage(pages[i+2]):'<div class="page"></div>'}
          ${pages[i+3]?makePage(pages[i+3]):'<div class="page"></div>'}
        </div>`;

      book.appendChild(sheet);
      sheets.push(sheet);
    }

  }

  render();
}

function render(){

  sheets.forEach((s,i)=>{

    if(i<index) s.classList.add("flipped");
    else s.classList.remove("flipped");

    s.style.zIndex=sheets.length-i;
  });

  if(mobile())
    counter.textContent=`${index+1} / 20`;
  else
    counter.textContent=`${index+1} / ${sheets.length}`;
}

next.onclick=()=>{

  if(index<sheets.length-1){

    index++;
    flipSound();
    render();
  }
};

prev.onclick=()=>{

  if(index>0){

    index--;
    flipSound();
    render();
  }
};

window.addEventListener("keydown",e=>{

  if(e.key==="ArrowRight") next.click();
  if(e.key==="ArrowLeft") prev.click();
});

let startX=0;

book.addEventListener("touchstart",e=>{
  startX=e.touches[0].clientX;
},{passive:true});

book.addEventListener("touchend",e=>{

  const dx=e.changedTouches[0].clientX-startX;

  if(dx<-45) next.click();
  if(dx>45) prev.click();

},{passive:true});

window.addEventListener("resize",()=>{

  const realPage=mobile()?index:index*2;

  build();

  if(mobile())
    index=Math.min(realPage,19);
  else
    index=Math.min(Math.floor(realPage/2),9);

  render();

});

window.addEventListener("orientationchange",()=>{

  setTimeout(()=>{

    build();

  },220);

});

build();
</script>

</body>
</html>
