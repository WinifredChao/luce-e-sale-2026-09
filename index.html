<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>光與鹽｜09-2026</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#d9d2c7;
    font-family:"Noto Sans TC",sans-serif;
}

.viewer{
    width:100vw;
    height:100dvh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:12px;
    gap:16px;
}

.book{
    flex:1;
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
}

.spread{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:0;
    filter:drop-shadow(0 18px 35px rgba(0,0,0,.3));
}

.page{
    width:min(42vw,495px);
    aspect-ratio:210/297;
    background:white;
}

.page img{
    width:100%;
    height:100%;
    display:block;
    object-fit:cover;
}

.single .page{
    width:min(70vw,495px);
}

.controls{
    display:flex;
    align-items:center;
    gap:16px;
    padding-bottom:max(8px,env(safe-area-inset-bottom));
}

button{
    width:58px;
    height:58px;
    border:none;
    border-radius:50%;
    background:#8a4b23;
    color:white;
    font-size:28px;
}

.counter{
    background:white;
    border-radius:24px;
    padding:12px 24px;
    min-width:120px;
    text-align:center;
    font-size:20px;
}

/* 手機 */

@media (max-width:768px){

.viewer{
    height:100dvh;
}

.book{
    width:100%;
}

.spread{
    flex-direction:column;
}

.page{
    width:min(94vw,495px);
}

.page img{
    object-fit:contain;
}

.spread .page:nth-child(2){
    display:none;
}

.single .page{
    width:min(94vw,495px);
}

button{
    width:54px;
    height:54px;
    font-size:24px;
}

.counter{
    font-size:18px;
}
}
</style>
</head>

<body>

<div class="viewer">

<div class="book">
<div id="spread" class="spread"></div>
</div>

<div class="controls">
<button id="prev">←</button>
<div id="counter" class="counter"></div>
<button id="next">→</button>
</div>

</div>

<script>
const TOTAL=20;
const spreads=[[1]];

for(let i=2;i<=TOTAL;i+=2){
    spreads.push(i+1<=TOTAL?[i,i+1]:[i]);
}

let current=0;
const spread=document.getElementById("spread");
const counter=document.getElementById("counter");

function render(){

    const mobile=window.innerWidth<=768;
    const pages=spreads[current];

    spread.className=pages.length===1?"spread single":"spread";
    spread.innerHTML="";

    (mobile?[pages[0]]:pages).forEach(p=>{

        const page=document.createElement("div");
        page.className="page";

        const img=document.createElement("img");
        img.src=p+".png";

        img.onload=()=>{
            requestAnimationFrame(()=>window.dispatchEvent(new Event("resize")));
        };

        page.appendChild(img);
        spread.appendChild(page);
    });

    counter.textContent=`${pages[0]} / ${TOTAL}`;

    prev.disabled=current===0;
    next.disabled=current===spreads.length-1;
}

function nextPage(){
    if(current<spreads.length-1){
        current++;
        render();
    }
}

function prevPage(){
    if(current>0){
        current--;
        render();
    }
}

next.onclick=nextPage;
prev.onclick=prevPage;

window.addEventListener("keydown",e=>{
    if(e.key==="ArrowRight")nextPage();
    if(e.key==="ArrowLeft")prevPage();
});

let startX=0;

document.querySelector(".book").addEventListener("touchstart",e=>{
    startX=e.touches[0].clientX;
});

document.querySelector(".book").addEventListener("touchend",e=>{
    const dx=e.changedTouches[0].clientX-startX;
    if(dx<-60)nextPage();
    if(dx>60)prevPage();
});

/* iPhone 修正 */

window.addEventListener("resize",()=>{
    document.querySelector(".viewer").style.height=window.innerHeight+"px";
});

window.addEventListener("orientationchange",()=>{
    setTimeout(()=>{
        document.querySelector(".viewer").style.height=window.innerHeight+"px";
        render();
    },250);
});

window.addEventListener("load",()=>{
    document.querySelector(".viewer").style.height=window.innerHeight+"px";
    setTimeout(render,120);
});

render();
</script>

</body>
</html>
